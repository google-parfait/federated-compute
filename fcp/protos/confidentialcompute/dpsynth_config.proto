syntax = "proto3";

package fcp.confidentialcompute;

import "fcp/protos/confidentialcompute/access_policy.proto";

// Configures the dpsynth container initialization.
message DpsynthContainerInitializeConfiguration {
  // Required: YAML string defining the dataset domain/schema (produced via
  // `dpsynth.to_yaml(schema)` and loaded inside the container via
  // `dpsynth.from_yaml`).
  string domain_yaml = 1;

  // Optional: YAML string defining the `dpsynth.TabularConfig` (or
  // `dpsynth.DiscreteConfig`) synthesis mechanism (produced via
  // `dpsynth.to_yaml(config)` and loaded via `dpsynth.from_yaml`).
  // If empty, defaults to `dpsynth.TabularConfig()` (which uses `MSTConfig`).
  //
  // Example:
  //   type: TabularConfig
  //   discrete_mechanism:
  //     type: AIMConfig
  //     max_rounds: 15
  string mechanism_yaml = 2;
}

// Config constraints for the dpsynth container. They must be validated before
// any of the blobs written to the container are processed.
message DpsynthContainerConfigConstraints {
  // Defines limits on the accesses to blobs.
  AccessBudget access_budget = 1;

  // The minimum size of the aggregation window in minutes (for time-based
  // budget tracking).
  uint64 min_agg_window_minutes = 2;

  // Target differential privacy epsilon (must be > 0).
  double epsilon = 3;

  // Target differential privacy delta (must be >= 0, and > 0 for approximate
  // DP mechanisms).
  double delta = 4;

  // Maximum number of records each privacy unit may contribute (defaults to 1
  // if unset; must be >= 1). Used both to bound per-input rows and as
  // `group_size` in `dpsynth.calibrate`.
  optional int64 max_records_per_user = 5;
}
