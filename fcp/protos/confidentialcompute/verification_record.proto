syntax = "proto3";

package fcp.confidentialcompute;

import "fcp/protos/confidentialcompute/payload_transparency.proto";

option java_multiple_files = true;

// A record containing the key pieces of information that were verified by the
// `AttestationVerifier` implementation during the course of a
// `ConfidentialAggregations` session, and which the verifier deemed valid.
message AttestationVerificationRecord {
  reserved 1, 2, 3;

  // The upload encryption key that was verified. This corresponds to the
  // server-provided `ConfidentialEncryptionConfig.encryption_key` field in the
  // `ConfidentialAggregations` protocol.
  SignedPayload encryption_key = 4;

  // The pipeline configuration that was verified. This corresponds to the
  // server-provided `SignedEndorsements.pipeline_configuration`
  // field in the `TaskAssignments` protocol.
  SignedPayload pipeline_configuration = 5;
}
