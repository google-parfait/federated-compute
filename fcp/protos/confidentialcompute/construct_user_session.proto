syntax = "proto3";

package fcp.confidentialcompute;

import "google/protobuf/timestamp.proto";

option java_package = "com.google.intelligence.fcp.confidentialcompute";
option java_multiple_files = true;
option java_outer_classname = "ConstructUserSessionProto";

// Configures the ConstructUserSession container upon initialization.
message ConstructUserSessionInitConfig {
  // The time-window related metadata for the constructed user session.
  SessionTimeWindowMetadata time_window_metadata = 1;

  // The query prefix used to dynamically locate system tensors like
  // confidential_compute_event_time.
  string on_device_query_name = 3;
}

// Time-window related metadata for the constructed user session.
message SessionTimeWindowMetadata {
  // The start of the session time window. Inclusive.
  google.protobuf.Timestamp session_window_start = 1;

  // The end of the session time window. Exclusive.
  google.protobuf.Timestamp session_window_end = 2;

  // The KMS key ids of the original client blobs contributing to this session.
  // This is required during the migration to time-based budget tracking to
  // prevent backsliding: when consuming a session blob under the time budget,
  // the downstream container verifies that the original blobs still have
  // remaining key-based budget, preventing previously exhausted blobs from
  // being re-consumed.
  // TODO: b/552613080 - Remove this field once migration to time-based budgets
  // is complete.
  repeated bytes key_ids = 3;
}
