syntax = "proto3";  // Our OSS build does not support editions.

package fcp.confidentialcompute;

option java_multiple_files = true;
option java_package = "com.google.intelligence.fcp.confidentialcompute";
option java_outer_classname = "SentenceTransformersConfigProto";

// Configuration for the SentenceTransformers embedding generation process,
// including parameters passed to SentenceTransformer.encode() (e.g. prompt)
// and inference execution optimizations (e.g. length bucketing).
message EncodeConfig {
  // The prompt to use for encoding. Maps to the prompt parameter for
  // SentenceTransformer.encode():
  // https://github.com/UKPLab/sentence-transformers/blob/master/sentence_transformers/SentenceTransformer.py
  //
  // e.g. for encoding gemma, to generate optimized embedding for clustering,
  // use the prompt: "task: clustering | query: {content}".  The content is the
  // original text to be encoded.
  string prompt = 1;

  // Optional sequence length bucket boundaries (e.g. [8, 16, 32, 64, 128, 256,
  // 512]).
  //
  // In standard transformer inference, all sequences within a batch must be
  // padded to the length of the longest sequence in that batch. Under typical
  // natural language distributions (log-normal), shorter sentences are far
  // more common while rare long sentences form a heavy tail. Random unbucketed
  // batching frequently pairs short sentences with long-tail sentences, forcing
  // short sentences to be heavily padded and wasting significant CPU
  // self-attention and projection GEMM FLOPs on pad tokens.
  //
  // Providing geometric bucket boundaries partitions inputs by length before
  // batching so that batches contain only similarly-sized sequences. This
  // mathematically bounds intra-bucket padding to <= 25%-28% and yields a
  // 2.5x-4x CPU inference speedup.
  //
  // If empty, length bucketing is disabled to preserve legacy unbucketed
  // batching behavior.
  repeated int32 bucket_boundaries = 2;
}

// Configures the SentenceTransformers container initialization.
message SentenceTransformersContainerInitializeConfiguration {
  // The configuration_id for the model artifacts blob. It should match
  // StreamInitializeRequest.write_configuration.first_request_metadata.configuration_id
  // for the model artifacts blob.
  // The model artifacts is a directory containing the model weights, tokenizer
  // model and various config files. The whole directory is compressed into one
  // blob.
  string model_artifacts_configuration_id = 1;

  // The configuration for the encode() method.
  EncodeConfig encode_config = 2;
}

message Input {
  // The index of the input.
  int32 index = 1;
  // The text to be encoded.
  string text = 2;
}

// The embedding of a sentence.
message Embedding {
  // The index of the embedding.
  int32 index = 1;
  // The values of the embedding.
  repeated float values = 2;
}
