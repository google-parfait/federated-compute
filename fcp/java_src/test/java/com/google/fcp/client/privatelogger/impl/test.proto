syntax = "proto3";

package fcp.client.privatelogger.impl.test;

import "google/protobuf/timestamp.proto";

option java_package = "com.google.fcp.client.privatelogger.impl.test";
option java_multiple_files = true;

// Represents the type of activity that was performed.
enum ActivityType {
  ACTIVITY_TYPE_UNSPECIFIED = 0;
  ACTIVITY_TYPE_WALKING = 1;
  ACTIVITY_TYPE_RUNNING = 2;
  ACTIVITY_TYPE_BIKING = 3;
}

// Represents a single activity that was performed. This is the raw data that is
// logged to the PrivateLogger.
message ActivityProto {
  google.protobuf.Timestamp timestamp = 1;
  ActivityType activity_type = 2;
  double distance_meters = 3;
  int32 average_heart_rate = 4;
  int32 duration_seconds = 5;
}
