syntax = "proto3";

package fcp.client.confidentialcompute.swor;

option java_package = "com.google.fcp.client.confidentialcompute.internal.swor";
option java_multiple_files = true;

// On-device state of SworStore.
message SworState {
  // Start time of the last upload per workload set, keyed by workload set name.
  map<string, int64> last_upload_epoch_millis = 1;

  // Time from which last_upload_epoch_millis can be trusted: when the store was
  // first used, or first used after a corrupt file was replaced. 0 until then.
  int64 earliest_trustworthy_epoch_millis = 2;
}
